# Builds the game and publishes it as a GitHub Release whenever a new version reaches main (every
# build commit changes scripts/version.gd): it tags the commit (v0.45.0-build50), and attaches the
# Windows zip and the source zip to the release, so the downloads no longer grow the repository.
# Before building it imports the project and runs every test (tools/run_all.py); a failing test stops the
# release. It can also be started by hand (Actions > Release > Run workflow).
name: Release

on:
  push:
    branches: [main]
    paths: ["scripts/version.gd"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The version
        run: |
          NUM=$(grep -oP 'const NUMBER := "\K[^"]+' scripts/version.gd)
          BUILD=$(grep -oP 'const BUILD := \K[0-9]+' scripts/version.gd)
          FIX=$(grep -oP 'const FIX := \K[0-9]+' scripts/version.gd)
          NAME="$BUILD"; if [ "$FIX" != "0" ]; then NAME="$BUILD.$FIX"; fi
          echo "TAG=v$NUM-build$NAME" >> "$GITHUB_ENV"
          echo "TITLE=Hearthlands v$NUM build $NAME" >> "$GITHUB_ENV"

      - name: Godot 4.3 and its export templates
        # (downloaded outside the project, so the source zip does not take them in)
        run: |
          cd "$RUNNER_TEMP"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_linux.x86_64.zip -d godot
          unzip -q Godot_v4.3-stable_export_templates.tpz -d tpl
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mv tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm -f Godot_v4.3-stable_linux.x86_64.zip Godot_v4.3-stable_export_templates.tpz
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"

      # The tests gate the release: if any fails, the job stops here and nothing is tagged or published.
      - name: Import the project
        run: '"$GODOT" --headless --import'

      - name: Run every test
        # (run_all.py uses $GODOT; the window tests run under xvfb-run, which the runner has)
        timeout-minutes: 60
        run: python3 tools/run_all.py

      - name: Build the zips
        run: python3 tools/make_build.py --no-bump --no-check --out "$RUNNER_TEMP/out"

      - name: The release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TITLE }}
          make_latest: true
          overwrite_files: true
          body_path: ${{ runner.temp }}/out/release_notes.md
          files: |
            ${{ runner.temp }}/out/Hearthlands-*-Windows.zip
            ${{ runner.temp }}/out/Hearthlands-*-Source.zip
